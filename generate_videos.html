<!DOCTYPE html>
<html>
<head>
  <title>AI Commercial & Promotional Video Generator</title>
  <style>
    body {
      background: #08090f;
      color: #e2e8f0;
      font-family: monospace;
      padding: 2rem;
    }
    #status {
      font-size: 1.2rem;
      color: #06b6d4;
      margin-bottom: 1rem;
    }
    .progress-bar {
      width: 100%;
      height: 12px;
      background: #1e293b;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 2rem;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #06b6d4, #10b981, #8b5cf6);
      width: 0%;
      transition: width 0.3s;
    }
    #log {
      background: #0f172a;
      padding: 1rem;
      border-radius: 8px;
      max-height: 400px;
      overflow-y: auto;
      font-size: 0.9rem;
      line-height: 1.6;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <h2>Generating AI Commercial & Promotional Videos...</h2>
  <div id="status">Initializing Video Pipeline...</div>
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
  <div id="log"></div>
  <canvas id="recCanvas" width="960" height="540" style="display:none;"></canvas>

  <script>
    const videosToGenerate = [
      // Promotional Video Samples
      {
        name: 'promo_saas_ai.webm',
        imgSrc: 'assets/promo_saas_ai.jpg',
        duration: 3500,
        effect: 'holographic_neural'
      },
      {
        name: 'promo_gaming_gear.webm',
        imgSrc: 'assets/promo_gaming_gear.jpg',
        duration: 3500,
        effect: 'rgb_overdrive'
      },
      {
        name: 'promo_cold_brew.webm',
        imgSrc: 'assets/promo_cold_brew.jpg',
        duration: 3500,
        effect: 'nitro_cascade'
      },
      {
        name: 'promo_smart_ring.webm',
        imgSrc: 'assets/promo_smart_ring.jpg',
        duration: 3500,
        effect: 'biometric_pulse'
      },
      {
        name: 'promo_diamond_ring.webm',
        imgSrc: 'assets/promo_diamond_ring.jpg',
        duration: 3500,
        effect: 'prismatic_flare'
      },
      {
        name: 'promo_urban_mobility.webm',
        imgSrc: 'assets/promo_urban_mobility.jpg',
        duration: 3500,
        effect: 'neon_velocity'
      },
      // Core Brand Commercials
      {
        name: 'luxury_watch_commercial.webm',
        imgSrc: 'assets/luxury_watch_commercial.jpg',
        duration: 3500,
        effect: 'chronos_kinetic'
      },
      {
        name: 'drone_tech_commercial.webm',
        imgSrc: 'assets/drone_tech_commercial.jpg',
        duration: 3500,
        effect: 'lidar_recon'
      },
      {
        name: 'fragrance_commercial.webm',
        imgSrc: 'assets/fragrance_commercial.jpg',
        duration: 3500,
        effect: 'crystal_shimmer'
      },
      {
        name: 'eyewear_commercial.webm',
        imgSrc: 'assets/eyewear_commercial.jpg',
        duration: 3500,
        effect: 'polarized_prism'
      },
      {
        name: 'ecom_tech_gadget.webm',
        imgSrc: 'assets/ecom_tech_gadget.jpg',
        duration: 3500,
        effect: 'acoustic_ripple'
      },
      {
        name: 'ecom_beauty_serum.webm',
        imgSrc: 'assets/ecom_beauty_serum.jpg',
        duration: 3500,
        effect: 'liquid_shimmer'
      },
      {
        name: 'ecom_beverage_splash.webm',
        imgSrc: 'assets/ecom_beverage_splash.jpg',
        duration: 3500,
        effect: 'vortex_pulse'
      },
      {
        name: 'ecom_sneaker_motion.webm',
        imgSrc: 'assets/ecom_sneaker_motion.jpg',
        duration: 3500,
        effect: 'cyber_energy'
      },
      {
        name: 'luxury_commercial.webm',
        imgSrc: 'assets/luxury_commercial.jpg',
        duration: 3500,
        effect: 'speed_chase'
      },
      {
        name: 'fashion_couture.webm',
        imgSrc: 'assets/fashion_couture.jpg',
        duration: 3500,
        effect: 'fluid_smoke'
      }
    ];

    const canvas = document.getElementById('recCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('log');
    const progressFill = document.getElementById('progress');

    function log(msg) {
      const p = document.createElement('div');
      p.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logDiv.appendChild(p);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function recordVideo(config) {
      statusDiv.innerHTML = `Recording & Synthesizing: <strong>${config.name}</strong> (${config.effect})`;
      log(`Starting render for ${config.name}...`);
      
      const img = new Image();
      img.src = config.imgSrc;
      await new Promise((resolve) => {
        img.onload = resolve;
        img.onerror = () => {
          log(`Warning: Failed to load ${config.imgSrc}, using fallback gradient.`);
          resolve();
        };
      });

      const stream = canvas.captureStream(30);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

      const recordedPromise = new Promise(resolve => {
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'video/webm' });
          resolve(blob);
        };
      });

      recorder.start();
      const startTime = performance.now();

      function drawFrame(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / config.duration);
        const t = elapsed / 1000;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Dynamic Cinematic Camera Zoom & Micro-Pan
        const zoom = 1 + 0.07 * Math.sin(progress * Math.PI);
        const panX = Math.sin(t * 1.3) * 12;
        const panY = Math.cos(t * 0.9) * 7;

        ctx.save();
        ctx.translate(canvas.width / 2 + panX, canvas.height / 2 + panY);
        ctx.scale(zoom, zoom);
        if (img.complete && img.naturalWidth > 0) {
          ctx.drawImage(img, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
        } else {
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(-canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
        }
        ctx.restore();

        // Procedural Motion FX Pipelines
        try {
          if (config.effect === 'holographic_neural') {
            // Holographic scan line
            const scanY = (t * 180) % canvas.height;
            ctx.strokeStyle = 'rgba(6, 182, 212, 0.5)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(0, scanY);
            ctx.lineTo(canvas.width, scanY);
            ctx.stroke();

            // Neural data node particles
            for (let i = 0; i < 24; i++) {
              const nx = 200 + Math.sin(t * 2 + i * 0.8) * 320 + Math.cos(i) * 60;
              const ny = 140 + Math.cos(t * 2.5 + i * 0.6) * 180;
              const nSize = Math.sin(t * 4 + i) * 2.5 + 3.5;
              ctx.fillStyle = i % 2 === 0 ? 'rgba(6, 182, 212, 0.85)' : 'rgba(168, 85, 247, 0.85)';
              ctx.beginPath();
              ctx.arc(nx, ny, Math.max(1, nSize), 0, Math.PI * 2);
              ctx.fill();

              if (i > 0 && i % 3 === 0) {
                ctx.strokeStyle = 'rgba(6, 182, 212, 0.25)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(nx, ny);
                ctx.lineTo(canvas.width / 2, canvas.height / 2);
                ctx.stroke();
              }
            }
          } else if (config.effect === 'rgb_overdrive') {
            const hue = (t * 100) % 360;
            const radial = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 40, canvas.width / 2, canvas.height / 2, 380);
            radial.addColorStop(0, `hsla(${hue}, 100%, 65%, 0.25)`);
            radial.addColorStop(0.6, `hsla(${(hue + 60) % 360}, 100%, 55%, 0.1)`);
            radial.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = radial;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let s = 0; s < 25; s++) {
              const sx = canvas.width / 2 + Math.cos(t * 5 + s) * (180 + s * 4);
              const sy = canvas.height / 2 + Math.sin(t * 6 + s * 1.2) * (120 + s * 3);
              ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(Math.sin(t * 8 + s)) * 0.9})`;
              ctx.beginPath();
              ctx.arc(sx, sy, Math.random() * 2.5 + 1.5, 0, Math.PI * 2);
              ctx.fill();
            }
          } else if (config.effect === 'nitro_cascade') {
            // Warm golden glow
            const radial = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 30, canvas.width / 2, canvas.height / 2, 320);
            radial.addColorStop(0, 'rgba(245, 158, 11, 0.25)');
            radial.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = radial;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Swirling nitro bubbles rising
            for (let b = 0; b < 30; b++) {
              const bx = (canvas.width / 2 - 120 + ((b * 45 + t * 40) % 240));
              const by = canvas.height - ((t * 90 + b * 28) % canvas.height);
              ctx.fillStyle = `rgba(253, 230, 138, ${Math.abs(Math.sin(t * 3 + b)) * 0.75})`;
              ctx.beginPath();
              ctx.arc(bx, by, Math.sin(t * 4 + b) * 1.5 + 2, 0, Math.PI * 2);
              ctx.fill();
            }
          } else if (config.effect === 'biometric_pulse') {
            for (let r = 0; r < 4; r++) {
              const radius = ((t * 70 + r * 65) % 220) + 40;
              const alpha = Math.max(0, 1 - radius / 250) * 0.45;
              ctx.beginPath();
              ctx.arc(canvas.width / 2 + panX, canvas.height / 2 + 30 + panY, radius, 0, Math.PI * 2);
              ctx.strokeStyle = `rgba(16, 185, 129, ${alpha})`;
              ctx.lineWidth = 3.5;
              ctx.stroke();
            }

            // Heartbeat ECG waveform
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(52, 211, 153, 0.5)';
            ctx.lineWidth = 2.5;
            for (let x = 0; x < canvas.width; x += 15) {
              const normX = (x + t * 250) % canvas.width;
              let pulse = Math.sin(normX * 0.05);
              if (normX > 400 && normX < 550) {
                pulse = Math.sin((normX - 400) * 0.2) * 45;
              }
              const y = canvas.height - 70 + pulse;
              if (x === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.stroke();
          } else if (config.effect === 'prismatic_flare') {
            const flareX = canvas.width / 2 + Math.sin(t * 1.5) * 80;
            const flareY = 200 + Math.cos(t * 1.2) * 30;

            const angles = [0, Math.PI / 4, Math.PI / 2, (3 * Math.PI) / 4];
            const colors = ['rgba(239, 68, 68, 0.6)', 'rgba(6, 182, 212, 0.7)', 'rgba(168, 85, 247, 0.6)', 'rgba(234, 179, 8, 0.7)'];
            angles.forEach((ang, idx) => {
              ctx.save();
              ctx.translate(flareX, flareY);
              ctx.rotate(ang + t * 0.5);
              ctx.strokeStyle = colors[idx];
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.moveTo(-90, 0);
              ctx.lineTo(90, 0);
              ctx.stroke();
              ctx.restore();
            });

            for (let d = 0; d < 22; d++) {
              const dx = (canvas.width / 2 + Math.sin(t * 2.5 + d * 2) * (140 + d * 8));
              const dy = (canvas.height / 2 + Math.cos(t * 3 + d * 1.8) * (100 + d * 6));
              ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(Math.sin(t * 6 + d)) * 0.9})`;
              ctx.beginPath();
              ctx.arc(dx, dy, 2.5, 0, Math.PI * 2);
              ctx.fill();
            }
          } else if (config.effect === 'neon_velocity') {
            for (let i = 0; i < 10; i++) {
              const lx = ((i * 110 + t * 500) % (canvas.width + 300)) - 150;
              const ly = 320 + Math.sin(i + t) * 60;
              ctx.strokeStyle = i % 2 === 0 ? 'rgba(6, 182, 212, 0.55)' : 'rgba(249, 115, 22, 0.55)';
              ctx.lineWidth = 3.5;
              ctx.beginPath();
              ctx.moveTo(lx - 160, ly);
              ctx.lineTo(lx, ly);
              ctx.stroke();
            }
          } else if (config.effect === 'chronos_kinetic') {
            for (let g = 0; g < 3; g++) {
              const rot = t * (0.8 + g * 0.4);
              ctx.save();
              ctx.translate(canvas.width / 2 + panX, canvas.height / 2 + panY);
              ctx.rotate(rot);
              ctx.strokeStyle = 'rgba(245, 158, 11, 0.35)';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.arc(0, 0, 90 + g * 50, 0, Math.PI * 1.5);
              ctx.stroke();
              ctx.restore();
            }
          } else if (config.effect === 'lidar_recon') {
            const sweepAngle = (t * 3) % (Math.PI * 2);
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(sweepAngle);
            ctx.strokeStyle = 'rgba(6, 182, 212, 0.45)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(260, 0);
            ctx.stroke();
            ctx.restore();
          } else if (config.effect === 'crystal_shimmer') {
            const grad = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 30, canvas.width / 2, canvas.height / 2, 300);
            grad.addColorStop(0, 'rgba(253, 230, 138, 0.25)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          } else if (config.effect === 'polarized_prism') {
            const sweepX = (t * 220) % canvas.width;
            ctx.fillStyle = 'rgba(6, 182, 212, 0.15)';
            ctx.fillRect(sweepX - 60, 0, 120, canvas.height);
          } else if (config.effect === 'acoustic_ripple') {
            for (let r = 0; r < 4; r++) {
              const radius = ((t * 80 + r * 60) % 200) + 30;
              const alpha = Math.max(0, 1 - radius / 230) * 0.4;
              ctx.beginPath();
              ctx.arc(360 + panX, 220 + panY, radius, 0, Math.PI * 2);
              ctx.strokeStyle = `rgba(6, 182, 212, ${alpha})`;
              ctx.lineWidth = 3;
              ctx.stroke();
            }
          } else if (config.effect === 'liquid_shimmer') {
            const radial = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 20, canvas.width / 2, canvas.height / 2, 300);
            radial.addColorStop(0, 'rgba(245, 158, 11, 0.25)');
            radial.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = radial;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          } else if (config.effect === 'vortex_pulse') {
            const pulse = Math.abs(Math.sin(t * 4)) * 0.35 + 0.1;
            const radial = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 20, canvas.width / 2, canvas.height / 2, 350);
            radial.addColorStop(0, `rgba(245, 158, 11, ${pulse})`);
            radial.addColorStop(0.5, `rgba(16, 185, 129, ${pulse * 0.6})`);
            radial.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = radial;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          } else if (config.effect === 'cyber_energy') {
            const sweepY = (t * 200) % canvas.height;
            ctx.strokeStyle = 'rgba(6, 182, 212, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, sweepY);
            ctx.lineTo(canvas.width, sweepY);
            ctx.stroke();
          } else if (config.effect === 'speed_chase') {
            for (let i = 0; i < 8; i++) {
              const lx = ((i * 120 + t * 400) % (canvas.width + 200)) - 100;
              const ly = 280 + i * 15;
              ctx.strokeStyle = `rgba(6, 182, 212, ${0.4 * (1 - i / 8)})`;
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.moveTo(lx - 120, ly);
              ctx.lineTo(lx, ly);
              ctx.stroke();
            }
          } else if (config.effect === 'fluid_smoke') {
            const laserAngle = Math.sin(t * 2) * 0.3;
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(laserAngle);
            ctx.strokeStyle = 'rgba(139, 92, 246, 0.35)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(-canvas.width, -80);
            ctx.lineTo(canvas.width, 80);
            ctx.stroke();
            ctx.restore();
          }
        } catch (fxErr) {
          // FX guard
        }

        // Cinematic Film Grain
        ctx.fillStyle = 'rgba(255, 255, 255, 0.025)';
        for (let g = 0; g < 100; g++) {
          ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1.5, 1.5);
        }

        if (progress < 1) {
          requestAnimationFrame(drawFrame);
        } else {
          recorder.stop();
        }
      }

      requestAnimationFrame(drawFrame);
      const blob = await recordedPromise;
      return blob;
    }

    async function generateAll() {
      let idx = 0;
      for (const item of videosToGenerate) {
        idx++;
        progressFill.style.width = `${((idx - 1) / videosToGenerate.length) * 100}%`;
        const blob = await recordVideo(item);
        
        const formData = new FormData();
        formData.append('filename', item.name);
        formData.append('video', blob, item.name);

        try {
          const res = await fetch('/save-video', {
            method: 'POST',
            body: formData
          });
          const json = await res.json();
          log(`✓ Successfully saved: <strong>${item.name}</strong> (${Math.round(blob.size / 1024)} KB)`);
        } catch (err) {
          log(`⚠️ Failed saving ${item.name}: ${err.message}`);
        }
      }

      progressFill.style.width = '100%';
      statusDiv.innerHTML = `✓ All ${videosToGenerate.length} AI Commercial & Promotional Videos Generated Successfully!`;
      log('All video renders completed and saved into /assets directory.');
    }

    window.onload = generateAll;
  </script>
</body>
</html>
