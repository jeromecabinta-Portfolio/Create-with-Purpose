<!DOCTYPE html>
<html>
<head>
  <title>AI Commercial & Promotional Video Generator</title>
  <style>
    body {
      background: #08090f;
      color: #e2e8f0;
      font-family: monospace;
      padding: 2rem;
    }
    #status {
      font-size: 1.2rem;
      color: #06b6d4;
      margin-bottom: 1rem;
    }
    .progress-bar {
      width: 100%;
      height: 12px;
      background: #1e293b;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 2rem;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #06b6d4, #10b981, #8b5cf6);
      width: 0%;
      transition: width 0.3s;
    }
    #log {
      background: #0f172a;
      padding: 1rem;
      border-radius: 8px;
      max-height: 400px;
      overflow-y: auto;
      font-size: 0.9rem;
      line-height: 1.6;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <h2>Generating AI Commercial Videos for New Signature Products...</h2>
  <div id="status">Initializing Video Pipeline...</div>
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
  <div id="log"></div>
  <canvas id="recCanvas" width="960" height="540" style="display:none;"></canvas>

  <script>
    const videosToGenerate = [
      {
        name: 'anta_kai_1.webm',
        imgSrc: 'assets/anta_kai_1.jpg',
        duration: 4000,
        effect: 'court_laser_telemetry'
      },
      {
        name: 'anta_kt9.webm',
        imgSrc: 'assets/anta_kt9.jpg',
        duration: 4000,
        effect: 'converse_weapon_arena'
      },
      {
        name: 'anta_shockwave_5.webm',
        imgSrc: 'assets/anta_shockwave_5.jpg',
        duration: 4000,
        effect: 'geometric_laser_grid'
      },
      {
        name: 'anta_c202_gt_pro.webm',
        imgSrc: 'assets/anta_c202_gt_pro.jpg',
        duration: 4000,
        effect: 'nike_vaporfly_speed'
      },
      {
        name: 'nike_alphafly_3.webm',
        imgSrc: 'assets/nike_alphafly_3.jpg',
        duration: 4000,
        effect: 'nike_vaporfly_speed'
      },
      {
        name: 'nike_kobe_8_protro.webm',
        imgSrc: 'assets/nike_kobe_8_protro.jpg',
        duration: 4000,
        effect: 'court_laser_telemetry'
      },
      {
        name: 'nike_ja_2.webm',
        imgSrc: 'assets/nike_ja_2.jpg',
        duration: 4000,
        effect: 'jordan_smoke_embers'
      },
      {
        name: 'nike_lebron_21.webm',
        imgSrc: 'assets/nike_lebron_21.jpg',
        duration: 4000,
        effect: 'pristine_light_caustics'
      },
      {
        name: 'nike_sabrina_2.webm',
        imgSrc: 'assets/nike_sabrina_2.jpg',
        duration: 4000,
        effect: 'geometric_laser_grid'
      },
      {
        name: 'nike_air_max_dn.webm',
        imgSrc: 'assets/nike_air_max_dn.jpg',
        duration: 4000,
        effect: 'nike_air_pulse'
      },
      {
        name: 'nike_gt_cut_3.webm',
        imgSrc: 'assets/nike_gt_cut_3.jpg',
        duration: 4000,
        effect: 'holographic_neural'
      },
      {
        name: 'nike_book_1.webm',
        imgSrc: 'assets/nike_book_1.jpg',
        duration: 4000,
        effect: 'skate_golden_sunlight'
      },
      {
        name: 'nike_pegasus_41.webm',
        imgSrc: 'assets/nike_pegasus_41.jpg',
        duration: 4000,
        effect: 'nike_vaporfly_speed'
      }
    ];

    const canvas = document.getElementById('recCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('log');
    const progressFill = document.getElementById('progress');

    function log(msg) {
      const p = document.createElement('div');
      p.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logDiv.appendChild(p);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function recordVideo(config) {
      statusDiv.innerHTML = `Recording & Synthesizing: <strong>${config.name}</strong> (${config.effect})`;
      log(`Starting render for ${config.name}...`);
      
      const img = new Image();
      img.src = config.imgSrc + '?t=' + Date.now();
      await new Promise((resolve) => {
        img.onload = resolve;
        img.onerror = () => {
          log(`Warning: Failed to load ${config.imgSrc}`);
          resolve();
        };
      });

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      const stream = canvas.captureStream(30);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

      const recordedPromise = new Promise(resolve => {
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'video/webm' });
          resolve(blob);
        };
      });

      recorder.start(250);

      const fps = 30;
      const frameInterval = 1000 / fps;
      const totalFrames = Math.round((config.duration / 1000) * fps);
      let frameIndex = 0;

      await new Promise((resolve) => {
        const intervalId = setInterval(() => {
          frameIndex++;
          const progress = Math.min(1, frameIndex / totalFrames);
          const t = (frameIndex * frameInterval) / 1000;

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          // Dynamic Cinematic Camera Zoom & Pan
          const zoom = 1 + 0.06 * Math.sin(progress * Math.PI);
          const panX = Math.sin(t * 1.5) * 10;
          const panY = Math.cos(t * 1.1) * 6;

          ctx.save();
          ctx.translate(canvas.width / 2 + panX, canvas.height / 2 + panY);
          ctx.scale(zoom, zoom);
          if (img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, -canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
          } else {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(-canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
          }
          ctx.restore();

          // Procedural Motion FX
          try {
            if (config.effect === 'jordan_smoke_embers') {
              const redGlow = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 40, canvas.width / 2, canvas.height / 2, 380);
              redGlow.addColorStop(0, `rgba(239, 68, 68, ${Math.abs(Math.sin(t * 3)) * 0.25 + 0.1})`);
              redGlow.addColorStop(1, 'rgba(0,0,0,0)');
              ctx.fillStyle = redGlow;
              ctx.fillRect(0, 0, canvas.width, canvas.height);

              for (let e = 0; e < 24; e++) {
                const ex = (canvas.width / 2 + Math.sin(t * 2 + e) * (180 + e * 5));
                const ey = canvas.height - ((t * 80 + e * 30) % canvas.height);
                ctx.fillStyle = `rgba(254, 202, 202, ${Math.abs(Math.sin(t * 5 + e)) * 0.85})`;
                ctx.beginPath();
                ctx.arc(ex, ey, Math.sin(t * 4 + e) * 1.5 + 2, 0, Math.PI * 2);
                ctx.fill();
              }
            } else if (config.effect === 'pristine_light_caustics') {
              const sweepX = (t * 220) % (canvas.width + 200) - 100;
              const causticsGrad = ctx.createLinearGradient(sweepX - 80, 0, sweepX + 80, 0);
              causticsGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
              causticsGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.35)');
              causticsGrad.addColorStop(1, 'rgba(6, 182, 212, 0)');
              ctx.fillStyle = causticsGrad;
              ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else if (config.effect === 'geometric_laser_grid') {
              ctx.strokeStyle = `rgba(168, 85, 247, ${Math.abs(Math.sin(t * 2)) * 0.35 + 0.15})`;
              ctx.lineWidth = 1.5;
              for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y + (t * 20 % 40));
                ctx.lineTo(canvas.width, y + (t * 20 % 40));
                ctx.stroke();
              }
            } else if (config.effect === 'skate_golden_sunlight') {
              const flareX = canvas.width - 200 + Math.sin(t * 1.5) * 80;
              const flareY = 150 + Math.cos(t * 1.2) * 50;
              const sunFlare = ctx.createRadialGradient(flareX, flareY, 20, flareX, flareY, 350);
              sunFlare.addColorStop(0, 'rgba(254, 240, 138, 0.35)');
              sunFlare.addColorStop(0.4, 'rgba(245, 158, 11, 0.15)');
              sunFlare.addColorStop(1, 'rgba(0,0,0,0)');
              ctx.fillStyle = sunFlare;
              ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else if (config.effect === 'court_laser_telemetry') {
              const ringR = (t * 140) % 360;
              ctx.strokeStyle = `rgba(6, 182, 212, ${1 - ringR / 360})`;
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.ellipse(canvas.width / 2, canvas.height - 80, ringR * 1.8, ringR * 0.6, 0, 0, Math.PI * 2);
              ctx.stroke();
            } else if (config.effect === 'nike_air_pulse') {
              const pulseR = (t * 120) % 280;
              ctx.strokeStyle = `rgba(168, 85, 247, ${1 - pulseR / 280})`;
              ctx.lineWidth = 2.5;
              ctx.beginPath();
              ctx.arc(canvas.width / 2, canvas.height / 2, pulseR, 0, Math.PI * 2);
              ctx.stroke();
            } else if (config.effect === 'nike_vaporfly_speed') {
              for (let s = 0; s < 18; s++) {
                const sx = (canvas.width + 100 - (t * 700 + s * 90) % (canvas.width + 200));
                const sy = 120 + s * 22;
                ctx.strokeStyle = 'rgba(16, 185, 129, 0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(sx - 120, sy);
                ctx.stroke();
              }
            } else if (config.effect === 'converse_weapon_arena') {
              ctx.save();
              ctx.translate(canvas.width / 2, 0);
              ctx.rotate(Math.sin(t * 1.5) * 0.12);
              const beamGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
              beamGrad.addColorStop(0, 'rgba(250, 204, 21, 0.25)');
              beamGrad.addColorStop(1, 'rgba(250, 204, 21, 0)');
              ctx.fillStyle = beamGrad;
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.lineTo(160, canvas.height);
              ctx.lineTo(-160, canvas.height);
              ctx.closePath();
              ctx.fill();
              ctx.restore();
            } else if (config.effect === 'holographic_neural') {
              const scanY = (t * 180) % canvas.height;
              ctx.strokeStyle = 'rgba(6, 182, 212, 0.5)';
              ctx.lineWidth = 2.5;
              ctx.beginPath();
              ctx.moveTo(0, scanY);
              ctx.lineTo(canvas.width, scanY);
              ctx.stroke();
            }
          } catch (fxErr) {}

          // Subtle Film Grain
          ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
          for (let g = 0; g < 60; g++) {
            ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 1.5, 1.5);
          }

          if (frameIndex >= totalFrames) {
            clearInterval(intervalId);
            setTimeout(() => {
              recorder.stop();
              resolve();
            }, 250);
          }
        }, frameInterval);
      });

      const blob = await recordedPromise;
      return blob;
    }

    async function generateAll() {
      let idx = 0;
      for (const item of videosToGenerate) {
        idx++;
        progressFill.style.width = `${((idx - 1) / videosToGenerate.length) * 100}%`;
        const blob = await recordVideo(item);
        
        const formData = new FormData();
        formData.append('filename', item.name);
        formData.append('video', blob, item.name);

        try {
          const res = await fetch('/save-video', {
            method: 'POST',
            body: formData
          });
          const json = await res.json();
          log(`✓ Saved: <strong>${item.name}</strong> (${Math.round(blob.size / 1024)} KB)`);
        } catch (err) {
          log(`⚠️ Failed saving ${item.name}: ${err.message}`);
        }
      }

      progressFill.style.width = '100%';
      statusDiv.innerHTML = `✓ All Commercial Videos Generated Successfully!`;
      log('Done!');
    }

    window.onload = generateAll;
  </script>
</body>
</html>
